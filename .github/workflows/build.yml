name: Build (Windows)

on:
  push:
    branches: [ "master", "main", "sow/**" ]
  pull_request:
    branches: [ "master", "main", "sow/**" ]
  workflow_dispatch:

jobs:
  build:
    # Guard: if this workflow ever gets merged upstream (e.g. HoareLea),
    # it will show as "skipped" there and won't break their CI.
    if: github.repository_owner == 'SAM-BIM'
    runs-on: windows-2022

    env:
      MSBUILDDISABLENODEREUSE: "1"
      ORG_NAME: "SAM-BIM"
      # >>> CHANGE THIS PER REPO <<<
      # Examples: SAM, SAM_gbXML, SAM_GEM, SAM_Tas, ...
      REPO_NAME: "SAM_SolarCalculator"

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ env.REPO_NAME }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compute SAMVersion
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ref = if ('${{ github.event_name }}' -eq 'pull_request') { '${{ github.base_ref }}' } else { '${{ github.ref_name }}' }
          # .NET AssemblyVersion components are UInt16 (max 65535). Cap to 60000 for headroom.
          $run = ${{ github.run_number }} % 60000
          if ($ref -match 'sow/(\d{4})-Q(\d)') {
            $v = "$($Matches[1]).$($Matches[2]).$run"
            $src = "branch '$ref'"
          } else {
            $now = (Get-Date).ToUniversalTime()
            $quarter = [int][Math]::Ceiling($now.Month / 3.0)
            $v = "$($now.Year).$quarter.$run"
            $src = "date $($now.ToString('yyyy-MM-dd')) (ref '$ref' not sow/yyyy-Qx)"
          }
          Write-Host "SAMVersion = $v (from $src)"
          "samversion=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Clone dependency repos (siblings)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $org  = '${{ env.ORG_NAME }}'
          $repo = '${{ env.REPO_NAME }}'

          # >>> ADJUST BUILD ORDER HERE IF NEEDED <<<
          # Keep the current repo LAST.
          $buildOrder = @(
            'SAM'
            $repo
          )

          # Clone everything except the last one (already checked out by Actions)
          $deps = $buildOrder[0..($buildOrder.Count-2)]
          foreach ($r in $deps) {
            if (Test-Path $r) { continue }
            $headRef = '${{ github.head_ref }}'
            $baseRef = '${{ github.base_ref }}'
            $refName = '${{ github.ref_name }}'
            $candidates = @()
            if ($headRef) { $candidates += $headRef }
            # Current sow branch: base_ref on PR events, ref_name on push events.
            $sowRef = if ($baseRef -match '^sow/') { $baseRef } elseif ($refName -match '^sow/') { $refName } else { '' }
            if ($sowRef -and $sowRef -ne $headRef) { $candidates += $sowRef }
            # Quarterly integration fallback — but NOT when building the default branch directly (a plain
            # push to master/main with no PR head). There, dependencies must come from their own default
            # branch, not from quarterly code, otherwise master CI silently builds against sow/** and masks
            # integration/branch-skew issues.
            $isDefaultBranchBuild = (-not $headRef) -and ($refName -eq 'master' -or $refName -eq 'main')
            if (-not $isDefaultBranchBuild) { $candidates += 'sow/2026-Q2' }
            $cloned = $false
            foreach ($cand in $candidates) {
              $has = (git ls-remote --heads "https://github.com/$org/$r.git" $cand 2>$null | Out-String).Trim()
              if ($has) {
                Write-Host "Cloning $org/$r @ $cand"
                git clone --depth 1 --branch $cand "https://github.com/$org/$r.git" $r
                $cloned = $true
                break
              }
            }
            if (-not $cloned) {
              Write-Host "Cloning $org/$r @ default branch"
              git clone --depth 1 "https://github.com/$org/$r.git" $r
            }
          }


          # Ensure ReferencePath exists even before SAM_Windows builds
          New-Item -ItemType Directory -Force -Path "SAM_Windows\build" | Out-Null

      - name: Restore + Rebuild in order (CI props like SAM_Deploy)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repo = '${{ env.REPO_NAME }}'
          $windowsRef = (Resolve-Path 'SAM_Windows\build').Path

          # IMPORTANT: keep these as an ARRAY of args (do NOT join into one string)
          $common = @(
            '/m:1'
            '/nr:false'
            '/v:m'
            '/p:Configuration=Release'
            '/p:UseSharedCompilation=false'
            '/p:RunPostBuildEvent=OnOutputUpdated'
            "/p:ReferencePath=$windowsRef"
            '/p:SAMVersion=${{ steps.ver.outputs.samversion }}'
          )

          # If you really want Platform, use QUOTED Any CPU:
          # $common += '/p:Platform="Any CPU"'

          # Same build order as above (keep repo LAST)
          $buildOrder = @(
            'SAM'
            $repo
          )

          # Convert build order -> solution paths (robust: first .sln in each folder)
          $solutions = foreach ($r in $buildOrder) {
            $sln = Get-ChildItem -Path $r -Filter *.sln -File | Select-Object -First 1
            if (-not $sln) { throw "No .sln found under: $r" }
            $sln.FullName
          }

          foreach ($sln in $solutions) {
            Write-Host "==> Restore: $sln"
            & msbuild $sln /t:Restore @common
          }

          foreach ($sln in $solutions) {
            Write-Host "==> Rebuild: $sln"
            & msbuild $sln /t:Rebuild @common
          }

      # The Rebuild above compiles the test project but never runs it, so a green check used to mean
      # only "it compiles". Everything the suite asserts - the Stage 11 gates, the SAM-vs-TAS
      # regression, the convergence studies - was unenforced. This runs it.
      # --no-build: the Release binaries already exist from the Rebuild step; recompiling here would
      # risk resolving the prebuilt SAM core DLLs differently from the assemblies under test.
      #
      # Category!=LongRunning is the FAST half. It keeps every inexpensive behavioural and
      # regression test - the Gate-7 optimiser cases including the Case7 1-D enumerated-optimum
      # check, the PenaltyDomain wanted-solar behaviour, the MinimumIncrement/grid-warning
      # regressions, the determinism checks and the JSON round-trips - and drops only the
      # convergence sweeps, exhaustive enumerations and expensive reference comparisons, which
      # long-running-tests.yml runs with the complementary Category=LongRunning filter. Untagged
      # tests are FAST by default, so a new test is covered by the required check unless someone
      # deliberately tags it out.
      - name: Run fast tests (Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proj = "${{ env.REPO_NAME }}\SAM_SolarCalculator.Tests\SAM.SolarCalculator.Tests.csproj"
          & dotnet test $proj --no-build -c Release `
            --filter "Category!=LongRunning" `
            --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Tests failed with exit code $LASTEXITCODE" }

      - name: Upload build folders (optional)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.REPO_NAME }}-build-folders
          path: |
            **\build\*
          if-no-files-found: warn
